name: loupe
on:
  pull_request:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - name: Install whip (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.6.1
          curl -fsSL -o whip "https://github.com/context-labs/whip/releases/download/${tag}/whip-linux-x64"
          chmod +x whip && sudo mv whip /usr/local/bin/whip
      - uses: anish-inf/loupe@feat/github-review-traces
        with:
          config: .loupe.json
          full: true
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
  chat:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - name: Install whip (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.6.1
          curl -fsSL -o whip "https://github.com/context-labs/whip/releases/download/${tag}/whip-linux-x64"
          chmod +x whip && sudo mv whip /usr/local/bin/whip
      - uses: anish-inf/loupe@feat/github-review-traces
        with:
          config: .loupe.json
          full: true
        env:
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
